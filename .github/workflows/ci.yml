name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Required gate — lint must pass to merge into main.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install (dev extra)
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

  # Advisory — runs the suite for visibility. Previously kept non-required
  # citing two failing tests/test_commands.py command-registry tests and an
  # unclean `ruff format` tree; a clean-env `pip install -e ".[dev]"` + pytest
  # run (2026-09-10 audit) showed 0 test failures, so the test-failure half of
  # that justification was stale. `ruff format --check` does still fail on
  # dozens of files, but this workflow never runs it, so it isn't protecting
  # anything here either way. Note: making this job actually block merges
  # needs a GitHub branch-protection change — editing this file alone does
  # not make the job required.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install (dev extra)
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest
