name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required gate — lint must pass to merge into main.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.11'

      - name: Check lockfile
        run: uv lock --check

      - name: Install (dev extra)
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Style ratchet
        run: uv run --frozen python scripts/style-baseline.py

      - name: Shellcheck install script
        run: shellcheck -S warning scripts/install.sh

  # Required check via branch protection (set in repo settings, not this file).
  # The parity tests skip loudly without the labrynth sibling checkout below
  # (see find_labrynth_root in src/reacher/mcp/sources/ts.py).
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reacher
    steps:
      - name: Checkout reacher
        uses: actions/checkout@v4
        with:
          path: reacher

      - name: Checkout labrynth
        uses: actions/checkout@v4
        with:
          repository: Otis-Lab-MUSC/labrynth
          path: labrynth

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: reacher/uv.lock
          python-version: '3.11'

      - name: Check lockfile
        run: uv lock --check

      - name: Install (dev extra)
        run: uv sync --frozen --extra dev

      # The host-compiled firmware tests (end-session outputs, golden traces)
      # build the real sketches with the runner's c++ and need the ArduinoJson
      # source, which is not vendored. Without it they skip, verifying nothing.
      - name: Fetch ArduinoJson for host-compiled firmware tests
        run: |
          git clone --quiet --depth 1 --branch v7.4.3 https://github.com/bblanchon/ArduinoJson.git "$RUNNER_TEMP/ArduinoJson"
          echo "ARDUINOJSON_SRC=$RUNNER_TEMP/ArduinoJson/src" >> "$GITHUB_ENV"

      - name: Tests
        run: uv run --frozen pytest -rs

  # Recompiles every sketch and requires the committed hex to match byte for
  # byte, so a firmware change or version bump without `compile.sh` fails here.
  firmware:
    name: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Install AVR core and ArduinoJson
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install ArduinoJson@7.4.3

      - name: Compile firmware
        run: bash firmware/compile.sh

      - name: Committed hex matches source
        run: |
          git diff --exit-code -- src/reacher/hex
          untracked="$(git status --porcelain src/reacher/hex)"
          if [ -n "$untracked" ]; then
            echo "compile.sh produced unexpected files:"
            echo "$untracked"
            exit 1
          fi

      - name: Explain hex mismatch
        if: failure()
        run: |
          echo "Files that differ from the committed hex:"
          git status --porcelain src/reacher/hex
          echo "committed hex does not match the firmware source: run bash firmware/compile.sh and commit the result"
